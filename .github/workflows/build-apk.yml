name: Build POSB Nagpur Viewer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/assets app/src/main/java/com/nagpur/posbviewer app/src/main/res/values
          mkdir -p "$(dirname 'settings.gradle')"
          echo  | base64 -d > 'settings.gradle'
          mkdir -p "$(dirname 'build.gradle')"
          echo cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQp9Cg== | base64 -d > 'build.gradle'
          mkdir -p "$(dirname 'gradle.properties')"
          echo b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCg== | base64 -d > 'gradle.properties'
          mkdir -p "$(dirname 'app/build.gradle')"
          echo  | base64 -d > 'app/build.gradle'
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          echo  | base64 -d > 'app/src/main/AndroidManifest.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          echo PHJlc291cmNlcz4KICAgIDxzdHJpbmcgbmFtZT0iYXBwX25hbWUiPlBPU0IgTmFncHVyIFZpZXdlcjwvc3RyaW5nPgo8L3Jlc291cmNlcz4K | base64 -d > 'app/src/main/res/values/strings.xml'
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          echo  | base64 -d > 'app/src/main/res/values/themes.xml'
          mkdir -p "$(dirname 'app/src/main/java/com/nagpur/posbviewer/MainActivity.java')"
          echo  | base64 -d > 'app/src/main/java/com/nagpur/posbviewer/MainActivity.java'
          cp index.html app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POSB-Nagpur-Viewer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
